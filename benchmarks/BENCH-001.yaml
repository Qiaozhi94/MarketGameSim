# BENCH-001：性能基准配置（加密式制度）
#
# 用途：PRD / KPI-004、002 / NFR-003 的性能门槛载体。
# 这是**性能基准**，不是研究基准——参与者构成只求覆盖代码路径，不追求统计特征。
# 研究用的基准市场配置由 M2 实验协议定义（待制定）。
#
# 第一版只有加密式一套制度（002 / D-1）。股票式配置随收盘、T+2、熔断一并后移。
#
# 状态：规格产物。字段名构成实现契约，实现时如需调整须同步本文与 event-schema.md。
# 本配置在首次实现完成后须按实测吞吐量校准一次（见 README.md §4）。
#
# 数值书写约定（ADR-005 §2）：所有非整数领域量写成带引号的字符串，由 Decimal 解析。
# 裸写 0.01 会被 yaml.safe_load 解析为 float，使「禁止 float 中转」在第一步失效。
# 整数（计数、纳秒时长、种子、万分数、分位点）无精度问题，照常书写。

benchmark_id: BENCH-001
schema_version: 1
regime: crypto_perp_free

# --- 终止条件 -------------------------------------------------------------
# 按已处理事件数精确终止，而非按仿真时长——保证跨机器、跨版本的工作量完全一致。
termination:
  max_events: 100000

# --- 随机性 ---------------------------------------------------------------
# 单一主种子，各代理 RNG 流按 agent_id 派生（KR-004）。
random:
  master_seed: 20260731

# --- 市场 -----------------------------------------------------------------
market:
  symbol: SYNTH-CRYPTO
  tick_size: "0.01"
  min_quantity: "0.001"
  # 最小结算单位（ADR-005 §1）。校验断言：tick_size × min_quantity 须为其整数倍
  # ——此处 1e-5 = 1000 × 1e-8，故成交名义金额无舍入。
  cash_unit: "1e-8"
  initial_price: "100.00"
  # 盘口一侧不可用时的替代价差（代理策略合同 §6.1）
  spread_fallback: "0.10"
  fees:
    maker_bps: "-1.0"              # 负值表示 maker 返佣
    taker_bps: "5.0"
    # maker_bps + taker_bps < 0 时属补贴型实验，配置校验须标注（ADR-005 §3）。

# --- 制度（002 / D-1）-----------------------------------------------------
# 钩子只能拒绝或延迟，不能改写订单。
regime_params:
  session: continuous_24_7         # 无收盘，无隔夜跳空
  settlement: immediate            # 即时结算
  short_selling: allowed           # 保证金范围内允许
  circuit_breaker: null            # 无熔断
  price_limit: null                # 无涨跌停

# --- 保证金与强平（002 / P-2）---------------------------------------------
# 口径为**保证金率**（保证金/名义价值），非担保比例（权益/保证金占用）——
# 后者在无仓位时分母为 0（账户与保证金合同 §3.1）。
margin:
  maint_bp: 500                    # 维持保证金率 5%
  target_bp: 1000                  # 强平后恢复至 10%，高于维持线以免立即二次触发
  grace_ns: 0                      # 第一版无代理会补保证金，宽限等价于纯延迟
  liquidation_latency_ns: 1000000  # 1 毫秒：风控判定到强平单入簿（事件 Schema §1.2）
                                   # 不得为 0——class 1→0 是回退跳转，须跨越时间
  funding_rate_bp: 0               # 第一版不启用资金费率（账户合同 §6）
  funding_interval_ns: 28800000000000        # 8 小时；费率为 0 时不产生任何转移
  # initial_bp 由各代理的 leverage_tier 推出：10000 / tier
  leverage_tiers: [1, 3, 10]       # 与下方 leverage_tier_distribution 一致
  # 强平连锁不得限速或打断（002 / D-2、FR-007）。

# --- 参与者 ---------------------------------------------------------------
# 共 190 个代理。散户不划分固定类别，信念权重从分布抽取（002 / D-3、P-1）。
agents:
  - role: retail
    count: 180
    initial_wallet: "100000.0"
    initial_position: "0"                  # 永续下净持仓恒为 0，初始仓位必须为 0
                                           # （账户合同 §7）；实际杠杆由代理内生建仓产生
    observe_interval_ns: 1000000000        # 1 秒
    latency_ns: 50000000                   # 50 毫秒（不得为 0，KR-006）
    # 杠杆【上限】分布，整数万分数；配置校验断言各档之和 == 10000。
    # 注意：这不是「初始杠杆分布」——初始杠杆恒为 0，此处决定的是各代理能开到多大
    # （旗舰问题的正确表述是「杠杆上限分布及其内生建仓后果」）。
    leverage_tier_distribution:
      "1": 6000                            # 60% 只能 1x
      "3": 3000                            # 30% 最高 3x
      "10": 1000                           # 10% 最高 10x——少数脆弱账户是连锁的触发条件
    belief:
      distribution: dirichlet
      # 五因子的浓度参数，顺序与 factors 一致（002 / P-1）
      alpha: ["1.0", "1.0", "0.8", "0.8", "1.5"]
    # 单笔数量上限；超出部分留待下次决策，不自动拆单（策略合同 §6）
    max_order_qty: "50.0"
    # 挂单激进度，逐代理抽取并固定：0=挂同侧最优价必为 maker，1=跨价差必为 taker
    # maker/taker 分化由此自然产生，不需要单独的代理类型（策略合同 §6.1）
    aggressiveness:
      distribution: uniform
      low: "0.0"
      high: "1.0"
    # scale 为固定尺度截断的分母（策略合同 §4.1）：normalized = clip(raw/scale, -1, 1)
    # 明确不用滚动 z-score——崩盘时标准差爆炸会把信号压到 0，恰在最该反应时失灵
    factors:
      - name: momentum                     # 信息源：价格历史
        lookback_bars: [5, 20, 60]         # 逐代理抽取
        scale: "0.01"                      # 1% 对数收益视为满信号
      - name: reversion                    # 信息源：价格历史（方向相反）
        half_life_trades:                  # 半衰期以成交笔数计（指标字典 §1.5）
          distribution: lognormal
          center: 200
          dispersion: "0.5"
        scale: "0.02"
      - name: herding                      # 信息源：成交流
        window_bars: [1, 5]
        scale: "1.0"                       # 原始值已在 [-1,1]
      - name: book                         # 信息源：订单簿状态
        depth_ticks: 10
        scale: "1.0"
      - name: noise                        # 信息源：无
        scale: "1.0"                       # 标准正态截断至 ±1
    # 因子相关矩阵须随研究运行输出；持续 >0.8 说明多样性为假（002 / P-1）。

  - role: inventory_market_maker
    count: 10
    initial_wallet: "1000000.0"
    initial_position: "0"
    observe_interval_ns: 100000000         # 0.1 秒，做市商观察更频繁
    latency_ns: 5000000                    # 5 毫秒，速度优势显式表达
    leverage_tier_distribution:
      "1": 10000
    max_inventory: "5000.0"
    quote_size: "10.0"
    # 做市商不使用信念信号，行为独立定义（策略合同 §8）
    half_spread: "0.05"                    # 报价半价差，5 tick
    inventory_skew_k: "1.0"                # 库存偏离满仓时报价整体移动 1 个 half_spread

# 大资金执行者与订单流预知者属 M3 范围，届时加入本配置并重新校准。

# --- 记录 -----------------------------------------------------------------
# 性能基准下关闭高开销记录，避免 I/O 掩盖内核性能。
logging:
  run_mode: benchmark                         # benchmark | research | interactive（002 / D-7）
  # benchmark 模式：digest 信息集 + 不落日志，仅用于计时，不产出研究结论
  account_snapshot_interval_ns: 10000000000   # 10 秒
  book_snapshot_interval_ns: 10000000000
  information_set_mode: digest                # 摘要哈希（E-001）；研究运行须用 full
  write_event_log: false                      # 计时运行不落盘

# --- 指标采样 -------------------------------------------------------------
metrics:
  bar_ns: 60000000000                         # K 线基础周期 60 秒（指标字典 §1.9）
  sampling_interval_ns: 1000000000            # Δt = 1 秒（D-001）
  volatility_window_samples: 30               # W（D-002）
  depth_ticks: 10                             # k（D-003）
  impact_bucket_percentiles: [20, 40, 60, 80, 95]   # D-004

# --- 性能门槛 -------------------------------------------------------------
# 判定见 README.md。thresholds 在首次实现后校准。
thresholds:
  # 墙钟阈值是性能测量值，不参与领域运算，故不适用 ADR-005 的整数/Decimal 约定。
  normalized_wall_seconds_max: 10.0
  # 硬件无关的算法回归断言：给定配置与种子，该计数完全确定。
  book_operations_golden: null                # 首次实现后写入

# --- 覆盖断言（README §1.1）-----------------------------------------------
# 基准必须真的走过要测的路径，否则门槛达标无意义。任一不满足即判定基准无效。
coverage_assertions:
  min_liquidations: 1
  min_chained_liquidations: 1                 # chain_depth >= 1
  min_partial_fills: 1
  min_cancels: 1
  min_one_sided_book_events: 1
