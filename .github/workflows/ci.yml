name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新提交取消仍在跑的旧任务，避免排队浪费。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 供应链加固：本工作流只读仓库，不需要写权限。
permissions:
  contents: read

jobs:
  # 真源与规格生命周期校验放在最前，且【不安装任何依赖】——它只用标准库。
  # 两份机器真源自相矛盾、或规格生命周期不合法时，后面的 lint 与测试都没有意义，
  # 因此这一步失败即中止。
  contract-sources:
    name: 真源与生命周期校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 校验 event_fields.json 与 traceability.json
        run: python tools/validate_contract_sources.py
      - name: 校验规格生命周期（frontmatter/状态/前置/链接/gate）
        run: python tools/validate_spec_lifecycle.py

  lint:
    name: ruff
    needs: contract-sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: pytest (${{ matrix.python-version }})
    needs: contract-sources
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 下限锁 3.11（requires-python）；上限跟随，用于尽早发现新版本的行为差异。
        # NFR-001 要求逐事件一致，跨版本差异必须在实现阶段就暴露，而不是实验阶段。
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # PYTHONHASHSEED=0 只是【让普通测试可复现】，**不是**检测误用内置 hash() 的手段。
      # 恰恰相反：固定 seed 会让一个误用 hash() 的实现在每次 CI 中稳定通过，
      # 把跨进程随机盐这个缺陷藏起来（第 36 章 P1-U03）。
      #
      # 真正的确定性门必须【跨两个不同 seed 的独立进程】比较同一运行的事件摘要，
      # 两者不等即失败。它需要哈希实现存在才能建立，由 0.1.1 T602 / 退出条件 E4 负责。
      #
      # 覆盖率门槛：语句+分支合并覆盖率 ≥90%（T001b：87% 提升至 90% 后实测 91%）。
      - env:
          PYTHONHASHSEED: "0"
        run: pytest --cov=src/market_game_sim/book --cov=src/market_game_sim/ledger --cov-branch --cov-fail-under=90
